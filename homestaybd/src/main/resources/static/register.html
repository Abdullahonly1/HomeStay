<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="container mt-5">
    <h2>Register</h2>
    <!-- রেজিস্টার ফর্মের উদাহরণ (পুরো ফর্মের অংশ) -->
    <form id="register-form">
        <div class="mb-3">
            <label for="username" class="form-label">ইউজারনেম *</label>
            <input type="text" class="form-control" id="username" name="username" required>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">ইমেইল *</label>
            <input type="email" class="form-control" id="email" name="email" required>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">পাসওয়ার্ড *</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>

        <!-- রোল চুজ করার জন্য রেডিও বাটন -->
        <div class="mb-3">
            <label class="form-label">আপনি কে? *</label>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="role" id="role-user" value="USER" required>
                <label class="form-check-label" for="role-user">ইউজার (রুম বুক করবো)</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="role" id="role-host" value="OWNER" required>
                <label class="form-check-label" for="role-host">হোস্ট (রুম দিবো)</label>
            </div>
        </div>

        <button type="submit" class="btn btn-primary w-100">রেজিস্টার করুন</button>
    </form>
</div>
<script src="/js/auth.js"></script>
</body>
</html>
